services:
  - type: web
    name: lucknowestate
    runtime: docker
    plan: starter          # persistent disk ke liye paid plan chahiye
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
